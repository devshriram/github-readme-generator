<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> GitHub README Generator </title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>

    <div id="header">
      <h1>  GitHub README Generator </h1>
    </div>

    <div id="main">
        <div id="details">
            <form>
                <p id="heading"> Enter GitHub Username </p>
                <input type="text" name="username" id="username" placeholder="e.g:- devshriram" required />
            </form>       
            <button type="button" id="button"> Generate README  </button>  
        </div>
    </div>

    <div id="footer">
     <p id="footer-text"> Made with <span id="heart"> ❤ </span> by <a href="https://github.com/devshriram/" target="_blank" id="admin"> Shriram Rai </a>  </p>
    </div>

    <script type="text/javascript" src="jquery-4.0.0.js"> </script>
    <script type="text/javascript" src="script.js"> </script>

</body>
</html>
